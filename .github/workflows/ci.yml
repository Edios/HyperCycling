name: CI

# The branch protection rule requires ONE status check named `check`. It is the last job below: it
# waits for every other job and fails unless all of them succeeded, so the others can run in
# parallel (and be added, split or renamed) without touching the repository settings.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (typecheck + lint)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: npm run typecheck
      - run: npm run lint

  # Client tests (jsdom): no coverage, nothing here is measured against a threshold.
  unit-client:
    name: unit (client)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: npm run test:client

  # Domain, storage and server tests (node) with the coverage thresholds of src/domain (90 %).
  unit-node:
    name: unit (domain + server, coverage)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: npm run test:node

  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - id: playwright
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browsers come from the cache; the system libraries they need do not.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --workers=3
      - name: Slowest specs (job summary)
        if: always()
        run: node scripts/e2e-timing.mjs test-results/results.json "shard ${{ matrix.shard }}/${{ strategy.job-total }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-timing-${{ matrix.shard }}
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results

  check:
    # `if: always()`: a skipped job counts as passing for a required check, and a failed or
    # cancelled dependency must not leave this one skipped.
    if: always()
    needs: [static, unit-client, unit-node, e2e]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
