name: Pages

# Publishes the static (IndexedDB) build at https://hypercycling.app/.
# The e2e suite already runs against this same build in ci.yml (Playwright project "pages").
# One-time setup in the repository: Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # "What's new" lists every merged pull request, also the one this push merged. Only the
      # deployed build is refreshed (nothing is committed); the committed list stays if gh fails.
      - name: Refresh the changelog
        run: npm run changelog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
