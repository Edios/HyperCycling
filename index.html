<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperCycling</title>
    <meta
      name="description"
      content="Indoor cycling workouts guided by a 1-10 effort scale, timed to your own music. Free, in your browser, no account."
    />
    <meta name="theme-color" content="#0b0e13" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/client/brand/intro-boot.css" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/BarlowCondensed-SemiBold.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/BarlowCondensed-ExtraBold.woff2"
      crossorigin
    />
    <script src="/intro-boot.js"></script>
    <meta property="og:title" content="HyperCycling" />
    <meta
      property="og:description"
      content="Indoor cycling workouts guided by a 1-10 effort scale, timed to your own music. Free, in your browser, no account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Brand intro: markup is static so it paints with the first frame; public/intro-boot.js decides
         whether it shows, src/client/brand/Intro.tsx removes it. Decorative, hidden from assistive tech. -->
    <div id="boot-intro" aria-hidden="true">
      <div class="row">
        <svg class="mark" viewBox="0 0 100 100" focusable="false"><!--INTRO_TICKS--></svg>
        <div class="name"><span class="w1">Hyper</span><span class="w2">Cycling</span></div>
      </div>
      <span class="hint"></span>
    </div>
    <div id="root">
      <!-- Fallback content for crawlers and no-JS: React replaces it on start. -->
      <h1>HyperCycling</h1>
      <p>
        Indoor cycling workouts guided by a 1-10 effort scale, timed to your own Spotify or YouTube
        music. Free, runs in your browser, no account. Turn on JavaScript to ride.
      </p>
      <p>
        Dane o tempie utworów:
        <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM</a>
      </p>
      <p>
        Open source (MIT):
        <a href="https://github.com/Edios/HyperCycling" target="_blank" rel="noopener">GitHub</a>
      </p>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
